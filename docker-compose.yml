services:
  sql-server:
    image: ${SQL_SERVER_IMAGE:-mcr.microsoft.com/mssql/server:2022-latest}
    container_name: ${SQL_SERVER_CONTAINER_NAME:-sql-server}
    user: root
    environment:
      - ACCEPT_EULA=${SQL_SERVER_ACCEPT_EULA}
      - MSSQL_SA_PASSWORD=${SQL_SERVER_PASSWORD}
      - MSSQL_PID=${SQL_SERVER_PID}
      - SQL_BACKUP_FOLDER=${SQL_BACKUP_FOLDER:-/var/opt/mssql/backups}
    entrypoint: ["/bin/bash", "-c", "mkdir -p \"$SQL_BACKUP_FOLDER\" && chown -R mssql:mssql \"$SQL_BACKUP_FOLDER\" && exec setpriv --reuid=10001 --regid=10001 --clear-groups /opt/mssql/bin/launch_sqlservr.sh /opt/mssql/bin/sqlservr"]
    ports:
      - "${SQL_SERVER_PORT}:1433"
    volumes:
      - ${SQL_SERVER_VOLUME_NAME:-sql-server-data}:/var/opt/mssql
      - ${BACKUP_VOLUME_NAME:-backup-data}:${SQL_BACKUP_FOLDER:-/var/opt/mssql/backups}

  web-api:
    image: ${DOCKER_REGISTRY:-}${WEB_API_IMAGE_NAME}
    container_name: ${WEB_API_CONTAINER_NAME:-web-api}
    build:
      context: .
      dockerfile: src/Web.Api/Dockerfile
    ports:
      - "${WEB_API_HTTP_PORT:-5000}:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_HTTP_PORTS=5000
      - ConnectionStrings__Database=Server=${SQL_SERVER_HOST};Database=${SQL_SERVER_DATABASE};User Id=${SQL_SERVER_USER};Password=${SQL_SERVER_PASSWORD};TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=true
      - SQL_BACKUP_FOLDER=${SQL_BACKUP_FOLDER:-/var/opt/mssql/backups}
      - Serilog__WriteTo__1__Args__ServerUrl=http://seq:80
    depends_on:
      sql-server:
        condition: service_started
      seq:
        condition: service_started
    volumes:
      - ${BACKUP_VOLUME_NAME:-backup-data}:/app/App_Data/sqlBackups

  web-ui:
    build:
      context: ./src/Web.UI
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: ${WEB_UI_CONTAINER_NAME:-web-ui}
    ports:
      - "${WEB_UI_PORT:-5002}:5002"
    depends_on:
      - web-api

  seq:
    image: ${SEQ_IMAGE:-datalust/seq:2024.3}
    container_name: ${SEQ_CONTAINER_NAME:-seq}
    environment:
      - ACCEPT_EULA=${SEQ_ACCEPT_EULA:-Y}
    ports:
      - "${SEQ_PORT}:80"

volumes:
  sql-server-data:
  backup-data:
