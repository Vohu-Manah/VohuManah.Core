services:
  web-api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=5000
      - ConnectionStrings__Database=Server=sql-server;Database=Library;User Id=sa;Password=Str0ng!Pass;TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=true
      - Serilog__WriteTo__1__Args__ServerUrl=http://seq:80
    ports:
      - "5000:5000"
    depends_on:
      sql-server:
        condition: service_started
      seq:
        condition: service_started

  web-ui:
    ports:
      - "5002:5002"
    depends_on:
      - web-api
